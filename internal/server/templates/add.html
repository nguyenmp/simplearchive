{{define "title"}}add — simplearchive{{end}}
{{define "content"}}
<section class="max-w-xl">
	<header class="flex items-center justify-between mb-4">
		<h1 class="text-2xl font-bold">Add a URL</h1>
		<a href="/" class="text-sm text-blue-600 hover:underline">← back to list</a>
	</header>

	{{if .Error}}
		<p class="mb-4 px-3 py-2 rounded bg-red-50 text-red-700 border border-red-200 text-sm">{{.Error}}</p>
	{{end}}

	<form action="/add" method="post" class="space-y-3">
		<label for="url" class="block text-sm font-semibold">URL</label>
		<input type="url" name="url" id="url" required
			value="{{.URL}}"
			placeholder="https://example.com"
			class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
		<p class="text-sm text-gray-500">Archiving runs synchronously (wget + favicon + headers).</p>
		<button type="submit"
			class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Archive</button>
	</form>
</section>
{{end}}
